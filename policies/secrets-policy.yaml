output_secrets: deny

protected_values:
  - "Maven usernames"
  - "Maven passwords"
  - "Nexus credentials"
  - "secret environment variable values"
  - "API tokens"
  - "GitLab tokens"
  - "database passwords"
  - "private keys"
  - "certificates"
  - "provider credentials"
  - "payment credentials"

maven_settings:
  source: "MAVEN_SETTINGS"
  may_print: false
  may_copy_into_repository: false
  may_modify: false
  may_search_alternative_paths: false

review_behavior:
  - "Configuration may be inspected structurally."
  - "Secret values must be redacted from review output."
  - "Do not decode, summarize, or expose protected values."
